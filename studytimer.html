
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flip Study Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 3D Flip Animation CSS */
    .perspective { perspective: 1000px; }
    .flip-top { transform-origin: bottom; backface-visibility: hidden; }
    .flip-bottom { transform-origin: top; backface-visibility: hidden; }
    .rotate-x-90 { transform: rotateX(90deg); }

    .animate-top { animation: flipTop 0.25s ease-in forwards; }
    .animate-bottom { animation: flipBottom 0.25s ease-out 0.25s forwards; }

    @keyframes flipTop {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(-90deg); }
    }
    @keyframes flipBottom {
      0% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    /* Hide scrollbar for chart but keep functionality */
    .custom-scrollbar::-webkit-scrollbar {
      height: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #171717; 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #404040; 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #525252; 
    }

    /* Theme Variables */
    :root {
      --bg-color: #000000;
      --card-bg-top: #0a0a0a;
      --card-bg-bottom: #121212;
      --text-color: #f0f0f0;
      --border-color: rgba(255,255,255,0.1);
      --divider-color: rgba(0,0,0,0.8);
      --separator-color: #525252;
    }

    /* Theme Transition Classes */
    .theme-bg { background-color: var(--bg-color); transition: background-color 0.4s ease; }
    .theme-card-top { background-color: var(--card-bg-top); transition: background-color 0.4s ease; }
    .theme-card-bot { background-color: var(--card-bg-bottom); transition: background-color 0.4s ease; }
    .theme-text { color: var(--text-color); transition: color 0.4s ease; }
    .theme-border { border-color: var(--border-color); transition: border-color 0.4s ease; }
    .theme-divider { background-color: var(--divider-color); border-bottom-color: var(--divider-color); transition: background-color 0.4s ease, border-color 0.4s ease; }
    .theme-separator { color: var(--separator-color); transition: color 0.4s ease; }

    /* Base Body Setup */
    body {
      margin: 0;
      background-color: var(--bg-color);
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.4s ease;
    }
  </style>
</head>
<body>

  <!-- Portrait Warning Overlay -->
  <div class="portrait:flex landscape:hidden fixed inset-0 z-50 bg-neutral-950 text-white items-center justify-center flex-col text-center p-6">
    <svg class="w-16 h-16 mb-6 text-neutral-400 animate-[spin_3s_linear_infinite]" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    <h2 class="text-3xl font-bold mb-2">Rotate Device</h2>
    <p class="text-neutral-500 max-w-xs">Please rotate your device to landscape mode for the best study timer experience.</p>
  </div>

  <!-- Main Landscape UI -->
  <div class="portrait:hidden flex flex-col w-full h-screen theme-bg overflow-hidden relative">
    
    <!-- Top Controls Bar -->
    <div class="w-full flex justify-end items-center p-4 sm:p-6 shrink-0 gap-3 md:gap-4 z-40">
      
      <!-- Play/Pause Button -->
      <button id="toggleBtn" class="group relative flex items-center justify-center w-12 h-12 md:w-14 md:h-14 rounded-full shadow-2xl transition-all duration-300 transform hover:scale-105 active:scale-95 bg-white text-black hover:bg-neutral-200 shrink-0">
        <svg id="icon-play" class="w-6 h-6 md:w-7 md:h-7 ml-1" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <svg id="icon-pause" class="w-6 h-6 md:w-7 md:h-7 hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
      </button>

      <div class="h-8 w-px bg-neutral-800/60 mx-1 shrink-0"></div>

      <!-- Customize Button -->
      <button id="btn-customize" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center rounded-full bg-neutral-900/50 hover:bg-neutral-800 text-neutral-400 transition-colors shrink-0">
        <svg class="w-5 h-5 md:w-6 md:h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
      </button>

      <!-- Calendar Button -->
      <button id="btn-chart" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center rounded-full bg-neutral-900/50 hover:bg-neutral-800 text-neutral-400 transition-colors shrink-0">
        <svg class="w-5 h-5 md:w-6 md:h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      </button>

      <button id="btn-password" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center rounded-full bg-neutral-900/50 hover:bg-neutral-800 text-neutral-400 transition-colors shrink-0">
        <svg class="w-5 h-5 md:w-6 md:h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>

    <!-- Flip Clock Main Area -->
    <div class="flex-1 flex items-center justify-center pb-8 sm:pb-16 lg:pb-24">
      <div class="flex items-center gap-2 sm:gap-4 md:gap-6 lg:gap-8 px-4 max-w-full">
        
        <!-- Hours -->
        <div id="digit-hours" data-value="00" class="relative w-24 h-36 sm:w-32 sm:h-48 md:w-44 md:h-64 lg:w-56 lg:h-[22rem] theme-card-bot rounded-2xl md:rounded-3xl shadow-2xl flex flex-col perspective theme-text font-mono border theme-border shrink-0">
          <div class="absolute inset-x-0 top-0 h-1/2 theme-card-top rounded-t-2xl md:rounded-t-3xl overflow-hidden flex justify-center items-end border-b theme-divider z-0">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold translate-y-[50%] tracking-tighter next-val">00</span>
          </div>
          <div class="absolute inset-x-0 bottom-0 h-1/2 theme-card-bot rounded-b-2xl md:rounded-b-3xl overflow-hidden flex justify-center items-start z-0">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold -translate-y-[50%] tracking-tighter current-val">00</span>
          </div>
          <div class="absolute inset-x-0 top-0 h-1/2 theme-card-bot rounded-t-2xl md:rounded-t-3xl overflow-hidden flex justify-center items-end border-b theme-divider flip-top z-10">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold translate-y-[50%] tracking-tighter current-val">00</span>
          </div>
          <div class="absolute inset-x-0 bottom-0 h-1/2 theme-card-top rounded-b-2xl md:rounded-b-3xl overflow-hidden flex justify-center items-start flip-bottom z-20 rotate-x-90">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold -translate-y-[50%] tracking-tighter next-val">00</span>
          </div>
          <div class="absolute inset-x-0 top-1/2 h-[3px] theme-divider z-30 transform -translate-y-1/2 shadow-[0_1px_2px_rgba(255,255,255,0.1)]"></div>
        </div>

        <div class="text-[3rem] sm:text-[4rem] md:text-[6rem] lg:text-[8rem] leading-none font-bold theme-separator mb-2 animate-pulse shrink-0">:</div>

        <!-- Minutes -->
        <div id="digit-minutes" data-value="00" class="relative w-24 h-36 sm:w-32 sm:h-48 md:w-44 md:h-64 lg:w-56 lg:h-[22rem] theme-card-bot rounded-2xl md:rounded-3xl shadow-2xl flex flex-col perspective theme-text font-mono border theme-border shrink-0">
          <div class="absolute inset-x-0 top-0 h-1/2 theme-card-top rounded-t-2xl md:rounded-t-3xl overflow-hidden flex justify-center items-end border-b theme-divider z-0">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold translate-y-[50%] tracking-tighter next-val">00</span>
          </div>
          <div class="absolute inset-x-0 bottom-0 h-1/2 theme-card-bot rounded-b-2xl md:rounded-b-3xl overflow-hidden flex justify-center items-start z-0">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold -translate-y-[50%] tracking-tighter current-val">00</span>
          </div>
          <div class="absolute inset-x-0 top-0 h-1/2 theme-card-bot rounded-t-2xl md:rounded-t-3xl overflow-hidden flex justify-center items-end border-b theme-divider flip-top z-10">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold translate-y-[50%] tracking-tighter current-val">00</span>
          </div>
          <div class="absolute inset-x-0 bottom-0 h-1/2 theme-card-top rounded-b-2xl md:rounded-b-3xl overflow-hidden flex justify-center items-start flip-bottom z-20 rotate-x-90">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold -translate-y-[50%] tracking-tighter next-val">00</span>
          </div>
          <div class="absolute inset-x-0 top-1/2 h-[3px] theme-divider z-30 transform -translate-y-1/2 shadow-[0_1px_2px_rgba(255,255,255,0.1)]"></div>
        </div>

        <div class="text-[3rem] sm:text-[4rem] md:text-[6rem] lg:text-[8rem] leading-none font-bold theme-separator mb-2 animate-pulse shrink-0">:</div>

        <!-- Seconds -->
        <div id="digit-seconds" data-value="00" class="relative w-24 h-36 sm:w-32 sm:h-48 md:w-44 md:h-64 lg:w-56 lg:h-[22rem] theme-card-bot rounded-2xl md:rounded-3xl shadow-2xl flex flex-col perspective theme-text font-mono border theme-border shrink-0">
          <div class="absolute inset-x-0 top-0 h-1/2 theme-card-top rounded-t-2xl md:rounded-t-3xl overflow-hidden flex justify-center items-end border-b theme-divider z-0">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold translate-y-[50%] tracking-tighter next-val">00</span>
          </div>
          <div class="absolute inset-x-0 bottom-0 h-1/2 theme-card-bot rounded-b-2xl md:rounded-b-3xl overflow-hidden flex justify-center items-start z-0">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold -translate-y-[50%] tracking-tighter current-val">00</span>
          </div>
          <div class="absolute inset-x-0 top-0 h-1/2 theme-card-bot rounded-t-2xl md:rounded-t-3xl overflow-hidden flex justify-center items-end border-b theme-divider flip-top z-10">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold translate-y-[50%] tracking-tighter current-val">00</span>
          </div>
          <div class="absolute inset-x-0 bottom-0 h-1/2 theme-card-top rounded-b-2xl md:rounded-b-3xl overflow-hidden flex justify-center items-start flip-bottom z-20 rotate-x-90">
            <span class="text-[4rem] sm:text-[5.5rem] md:text-[8rem] lg:text-[12rem] leading-none font-bold -translate-y-[50%] tracking-tighter next-val">00</span>
          </div>
          <div class="absolute inset-x-0 top-1/2 h-[3px] theme-divider z-30 transform -translate-y-1/2 shadow-[0_1px_2px_rgba(255,255,255,0.1)]"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Customize Modal -->
  <div id="customizeModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden items-center justify-center p-6">
    <div class="bg-neutral-900 w-full max-w-md rounded-3xl p-8 border border-neutral-800 shadow-2xl relative text-white">
      <button id="btn-close-customize" class="absolute top-6 right-6 text-neutral-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      
      <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
        <svg class="w-6 h-6 text-indigo-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
        Clock Theme
      </h2>
      
      <div class="grid grid-cols-2 gap-4">
        <!-- Classic Theme -->
        <button class="theme-btn border-2 rounded-xl p-4 flex flex-col items-center gap-3 transition-colors outline-none focus:ring-2 focus:ring-indigo-500" data-theme="classic">
          <div class="w-full h-16 rounded-lg bg-black border border-neutral-700 flex items-center justify-center relative overflow-hidden shadow-inner">
            <div class="absolute inset-x-0 top-0 h-1/2 bg-[#0a0a0a] border-b border-black/80"></div>
            <span class="text-[#f0f0f0] font-mono font-bold text-2xl relative z-10">00</span>
          </div>
          <span class="text-sm font-medium">Classic Dark</span>
        </button>
        
        <!-- Light Theme -->
        <button class="theme-btn border-2 rounded-xl p-4 flex flex-col items-center gap-3 transition-colors outline-none focus:ring-2 focus:ring-indigo-500" data-theme="light">
          <div class="w-full h-16 rounded-lg bg-[#f5f5f5] border border-neutral-300 flex items-center justify-center relative overflow-hidden shadow-inner">
            <div class="absolute inset-x-0 top-0 h-1/2 bg-[#e5e5e5] border-b border-white/80"></div>
            <span class="text-[#171717] font-mono font-bold text-2xl relative z-10">00</span>
          </div>
          <span class="text-sm font-medium">Clean Light</span>
        </button>

        <!-- Midnight Theme -->
        <button class="theme-btn border-2 rounded-xl p-4 flex flex-col items-center gap-3 transition-colors outline-none focus:ring-2 focus:ring-indigo-500" data-theme="midnight">
          <div class="w-full h-16 rounded-lg bg-[#020617] border border-slate-800 flex items-center justify-center relative overflow-hidden shadow-inner">
            <div class="absolute inset-x-0 top-0 h-1/2 bg-[#0f172a] border-b border-black/60"></div>
            <span class="text-[#38bdf8] font-mono font-bold text-2xl relative z-10">00</span>
          </div>
          <span class="text-sm font-medium">Midnight</span>
        </button>

        <!-- Matcha Theme -->
        <button class="theme-btn border-2 rounded-xl p-4 flex flex-col items-center gap-3 transition-colors outline-none focus:ring-2 focus:ring-indigo-500" data-theme="matcha">
          <div class="w-full h-16 rounded-lg bg-[#141b15] border border-green-900/50 flex items-center justify-center relative overflow-hidden shadow-inner">
            <div class="absolute inset-x-0 top-0 h-1/2 bg-[#1d2b1f] border-b border-black/60"></div>
            <span class="text-[#a3e635] font-mono font-bold text-2xl relative z-10">00</span>
          </div>
          <span class="text-sm font-medium">Matcha</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Calendar Modal -->
  <div id="chartModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden items-center justify-center p-4 sm:p-6 text-white">
    <div class="bg-neutral-900 w-full max-w-4xl rounded-3xl p-6 sm:p-8 border border-neutral-800 shadow-2xl relative flex flex-col max-h-[95vh]">
      <button id="btn-close-chart" class="absolute top-6 right-6 text-neutral-400 hover:text-white transition-colors z-10">
        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>

      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 pr-10">
        <h2 class="text-xl sm:text-2xl font-bold flex items-center gap-3">
          <svg class="w-6 h-6 text-indigo-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Study Calendar
        </h2>
        
        <div class="flex items-center gap-2 bg-neutral-800 rounded-lg p-1 w-full sm:w-auto justify-between sm:justify-start">
          <button id="btn-prev-month" class="p-2 hover:bg-neutral-700 rounded-md transition-colors text-neutral-300">
            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span id="calendar-month-display" class="font-medium min-w-[120px] text-center text-sm sm:text-base"></span>
          <button id="btn-next-month" class="p-2 hover:bg-neutral-700 rounded-md transition-colors text-neutral-300">
            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </div>
      
      <div class="w-full overflow-y-auto overflow-x-auto custom-scrollbar flex-1 pb-2">
        <div id="calendarGrid" class="min-w-[600px] w-full grid grid-cols-7 gap-2 sm:gap-3">
          <!-- Calendar injected via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Password Modal -->
  <div id="passwordModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden items-center justify-center p-6 text-white">
    <div class="bg-neutral-900 w-full max-w-md rounded-3xl p-8 border border-neutral-800 shadow-2xl relative">
      <button id="btn-close-password" class="absolute top-6 right-6 text-neutral-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      
      <div class="flex flex-col items-center text-center">
        <div class="w-16 h-16 bg-neutral-800 rounded-full flex items-center justify-center mb-6">
          <svg class="w-8 h-8 text-rose-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h2 class="text-2xl font-bold mb-2">Secure Restart</h2>
        <p id="pinPrompt" class="text-neutral-400 mb-8"></p>

        <form id="pinForm" class="w-full">
          <input
            type="password"
            id="pinInput"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="8"
            class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-6 py-4 text-center text-2xl tracking-[0.5em] text-white focus:outline-none focus:border-rose-500 transition-colors mb-4"
          />
          <p id="pinError" class="text-rose-400 text-sm mb-4 hidden"></p>
          
          <button type="submit" id="pinSubmitBtn" class="w-full bg-white text-black font-bold text-lg rounded-xl py-4 hover:bg-neutral-200 transition-colors active:scale-[0.98]">
            Reset Timer
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // --- Utility: Get Local Date String (YYYY-MM-DD) ---
    function getLocalISODate(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatTimeShort(totalSeconds) {
      if (!totalSeconds) return '';
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      
      if (h > 0 && m > 0) return `${h}h ${m}m`;
      if (h > 0) return `${h}h`;
      if (m > 0) return `${m}m`;
      return `<1m`; 
    }

    // --- State Variables ---
    let seconds = 0;
    let isRunning = false;
    let wakeLock = null;
    let timerInterval = null;
    let historyData = {};
    let currentCalDate = new Date();

    // --- Theme Config ---
    const themes = {
      classic: {
        '--bg-color': '#000000',
        '--card-bg-top': '#0a0a0a',
        '--card-bg-bottom': '#121212',
        '--text-color': '#f0f0f0',
        '--border-color': 'rgba(255,255,255,0.1)',
        '--divider-color': 'rgba(0,0,0,0.8)',
        '--separator-color': '#525252'
      },
      light: {
        '--bg-color': '#f5f5f5',
        '--card-bg-top': '#e5e5e5',
        '--card-bg-bottom': '#ffffff',
        '--text-color': '#171717',
        '--border-color': 'rgba(0,0,0,0.1)',
        '--divider-color': 'rgba(255,255,255,0.8)',
        '--separator-color': '#a3a3a3'
      },
      midnight: {
        '--bg-color': '#020617',
        '--card-bg-top': '#0f172a',
        '--card-bg-bottom': '#1e293b',
        '--text-color': '#38bdf8',
        '--border-color': 'rgba(56,189,248,0.2)',
        '--divider-color': 'rgba(0,0,0,0.6)',
        '--separator-color': '#0ea5e9'
      },
      matcha: {
        '--bg-color': '#141b15',
        '--card-bg-top': '#1d2b1f',
        '--card-bg-bottom': '#263b28',
        '--text-color': '#a3e635',
        '--border-color': 'rgba(163,230,53,0.2)',
        '--divider-color': 'rgba(0,0,0,0.6)',
        '--separator-color': '#65a30d'
      }
    };

    function applyTheme(themeName) {
      const theme = themes[themeName] || themes.classic;
      const root = document.documentElement;
      
      for (const [key, value] of Object.entries(theme)) {
        root.style.setProperty(key, value);
      }
      localStorage.setItem('studyTimerTheme', themeName);
      
      // Update modal active button state
      document.querySelectorAll('.theme-btn').forEach(btn => {
        if(btn.dataset.theme === themeName) {
           btn.classList.add('border-indigo-500', 'bg-indigo-500/10');
           btn.classList.remove('border-neutral-700');
        } else {
           btn.classList.remove('border-indigo-500', 'bg-indigo-500/10');
           btn.classList.add('border-neutral-700');
        }
      });
    }

    // --- Initialization ---
    function initApp() {
      // Load Theme
      const savedTheme = localStorage.getItem('studyTimerTheme') || 'classic';
      applyTheme(savedTheme);

      // Load Timer Data
      const storedStr = localStorage.getItem('studyTimer');
      let stored = storedStr ? JSON.parse(storedStr) : {};
      
      const today = getLocalISODate();
      historyData = stored.history || {};

      if (stored.lastDate === today) {
        seconds = stored.todayTime || 0;
      } else {
        if (stored.lastDate) {
          historyData[stored.lastDate] = stored.todayTime || 0;
        }
        stored.lastDate = today;
        stored.todayTime = 0;
        stored.history = historyData;
        localStorage.setItem('studyTimer', JSON.stringify(stored));
        seconds = 0;
      }
      renderTime(true); 
    }

    // --- 3D Flip Clock Logic ---
    function updateDigit(id, newValue, initialRender = false) {
      const container = document.getElementById(id);
      const valStr = String(newValue).padStart(2, '0');
      const currentVal = container.getAttribute('data-value');

      if (currentVal === valStr && !initialRender) return;

      const nextNodes = container.querySelectorAll('.next-val');
      const currentNodes = container.querySelectorAll('.current-val');
      const flipTop = container.querySelector('.flip-top');
      const flipBottom = container.querySelector('.flip-bottom');

      if (initialRender) {
        nextNodes.forEach(n => n.innerText = valStr);
        currentNodes.forEach(n => n.innerText = valStr);
        container.setAttribute('data-value', valStr);
        return;
      }

      nextNodes.forEach(n => n.innerText = valStr);
      flipTop.classList.add('animate-top');
      flipBottom.classList.add('animate-bottom');

      setTimeout(() => {
        currentNodes.forEach(n => n.innerText = valStr);
        flipTop.classList.remove('animate-top');
        flipBottom.classList.remove('animate-bottom');
        container.setAttribute('data-value', valStr);
      }, 500); 
    }

    function renderTime(initial = false) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;

      updateDigit('digit-hours', h, initial);
      updateDigit('digit-minutes', m, initial);
      updateDigit('digit-seconds', s, initial);
    }

    // --- Timer Logic ---
    function saveTick() {
      const today = getLocalISODate();
      const storedStr = localStorage.getItem('studyTimer');
      let stored = storedStr ? JSON.parse(storedStr) : {};

      if (stored.lastDate && stored.lastDate !== today) {
        stored.history = stored.history || {};
        stored.history[stored.lastDate] = stored.todayTime;
        stored.lastDate = today;
        stored.todayTime = 0;
        historyData = stored.history;
        seconds = 0;
      } else {
        stored.todayTime = (stored.todayTime || 0) + 1;
        stored.lastDate = today;
        seconds = stored.todayTime;
      }
      
      localStorage.setItem('studyTimer', JSON.stringify(stored));
      renderTime();
    }

    // --- Controls & APIs ---
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock denied');
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    function toggleTimer() {
      const btn = document.getElementById('toggleBtn');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');

      if (!isRunning) {
        isRunning = true;
        requestWakeLock();
        timerInterval = setInterval(saveTick, 1000);
        
        btn.classList.remove('bg-white', 'text-black', 'hover:bg-neutral-200');
        btn.classList.add('bg-neutral-800', 'hover:bg-neutral-700', 'text-white');
        iconPlay.classList.add('hidden');
        iconPause.classList.remove('hidden');
      } else {
        pauseTimer();
      }
    }

    function pauseTimer() {
      isRunning = false;
      releaseWakeLock();
      clearInterval(timerInterval);
      
      const btn = document.getElementById('toggleBtn');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');

      btn.classList.add('bg-white', 'text-black', 'hover:bg-neutral-200');
      btn.classList.remove('bg-neutral-800', 'hover:bg-neutral-700', 'text-white');
      iconPlay.classList.remove('hidden');
      iconPause.classList.add('hidden');
    }

    // --- Customization Modal ---
    function openCustomizeModal() {
      const modal = document.getElementById('customizeModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCustomizeModal() {
      const modal = document.getElementById('customizeModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // --- Calendar Logic ---
    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      
      // Format Month Year display
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('calendar-month-display').innerText = `${monthNames[month]} ${year}`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = getLocalISODate();

      // Combine history with today's live active data
      const displayData = { ...historyData };
      displayData[todayStr] = seconds;

      const grid = document.getElementById('calendarGrid');
      let html = '';

      // Day Headers
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      days.forEach(d => {
        html += `<div class="text-center text-sm font-bold text-neutral-500 pb-2">${d}</div>`;
      });

      // Empty pad cells
      for(let i = 0; i < firstDayIndex; i++) {
        html += `<div class="bg-neutral-800/10 rounded-xl h-20 sm:h-24 border border-neutral-800/30 pointer-events-none"></div>`;
      }

      // Day cells
      for(let i = 1; i <= daysInMonth; i++) {
        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(i).padStart(2, '0');
        const dateStr = `${year}-${mStr}-${dStr}`;
        
        const timeStudied = displayData[dateStr] || 0;
        const timeStr = formatTimeShort(timeStudied);
        
        const isToday = dateStr === todayStr;
        
        let cellClass = "bg-neutral-800/40 rounded-xl h-20 sm:h-24 p-2 flex flex-col border border-neutral-800 hover:bg-neutral-800 transition-colors relative group overflow-hidden";
        let textClass = "text-neutral-400";
        
        if (isToday) {
          cellClass += " ring-2 ring-indigo-500 bg-neutral-800";
          textClass = "text-indigo-400 font-bold";
        }
        
        let timeBadge = '';
        if (timeStudied > 0) {
          timeBadge = `<div class="mt-auto self-center bg-indigo-500/20 text-indigo-300 text-[10px] sm:text-xs font-bold px-1 sm:px-2 py-1 rounded w-full text-center truncate">${timeStr}</div>`;
        }

        html += `
          <div class="${cellClass}">
            <span class="text-sm ${textClass}">${i}</span>
            ${timeBadge}
          </div>
        `;
      }
      grid.innerHTML = html;
    }

    function openChartModal() {
      const modal = document.getElementById('chartModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      currentCalDate = new Date(); // Reset view to current month
      renderCalendar();
    }

    function closeChartModal() {
      const modal = document.getElementById('chartModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // --- Password Modal ---
    function openPasswordModal() {
      const modal = document.getElementById('passwordModal');
      const input = document.getElementById('pinInput');
      const prompt = document.getElementById('pinPrompt');
      const btn = document.getElementById('pinSubmitBtn');
      const error = document.getElementById('pinError');
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      error.classList.add('hidden');
      input.value = '';
      
      const savedPin = localStorage.getItem('timerPin');
      if (!savedPin) {
        prompt.innerText = "Create a 4-digit PIN to secure your timer resets.";
        input.placeholder = "Set new PIN";
        btn.innerText = "Set PIN & Reset";
      } else {
        prompt.innerText = "Enter your PIN to reset today's timer.";
        input.placeholder = "Enter PIN";
        btn.innerText = "Reset Timer";
      }
      setTimeout(() => input.focus(), 100);
    }

    function closePasswordModal() {
      const modal = document.getElementById('passwordModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function handleRestartSubmit(e) {
      e.preventDefault();
      const inputVal = document.getElementById('pinInput').value;
      const error = document.getElementById('pinError');
      const savedPin = localStorage.getItem('timerPin');

      error.classList.add('hidden');

      if (!savedPin) {
        if (inputVal.length >= 4) {
          localStorage.setItem('timerPin', inputVal);
          resetData();
        } else {
          error.innerText = "PIN must be at least 4 digits";
          error.classList.remove('hidden');
        }
      } else {
        if (inputVal === savedPin) {
          resetData();
        } else {
          error.innerText = "Incorrect PIN";
          error.classList.remove('hidden');
        }
      }
    }

    function resetData() {
      pauseTimer();
      seconds = 0;
      
      const storedStr = localStorage.getItem('studyTimer');
      let stored = storedStr ? JSON.parse(storedStr) : {};
      stored.todayTime = 0;
      localStorage.setItem('studyTimer', JSON.stringify(stored));
      
      renderTime(true);
      closePasswordModal();
    }

    // --- Event Listeners Setup ---
    document.addEventListener('DOMContentLoaded', () => {
      // Top Bar Actions
      document.getElementById('btn-customize').addEventListener('click', openCustomizeModal);
      document.getElementById('btn-chart').addEventListener('click', openChartModal);
      document.getElementById('btn-password').addEventListener('click', openPasswordModal);
      document.getElementById('toggleBtn').addEventListener('click', toggleTimer);
      
      // Close Modals
      document.getElementById('btn-close-customize').addEventListener('click', closeCustomizeModal);
      document.getElementById('btn-close-chart').addEventListener('click', closeChartModal);
      document.getElementById('btn-close-password').addEventListener('click', closePasswordModal);
      
      // Theme Buttons
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          applyTheme(e.currentTarget.dataset.theme);
        });
      });

      // Calendar Navigation
      document.getElementById('btn-prev-month').addEventListener('click', () => {
        currentCalDate.setMonth(currentCalDate.getMonth() - 1);
        renderCalendar();
      });
      document.getElementById('btn-next-month').addEventListener('click', () => {
        currentCalDate.setMonth(currentCalDate.getMonth() + 1);
        renderCalendar();
      });

      // Pin Form
      document.getElementById('pinForm').addEventListener('submit', handleRestartSubmit);

      // Pause on sleep / tab switch
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && isRunning) {
          pauseTimer();
        }
      });

      // Boot App
      initApp();
    });
  </script>
</body>
</html>
